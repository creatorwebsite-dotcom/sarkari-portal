name: Sarkari Naukar Data Sync

on:
  schedule:
    - cron: '0 */4 * * *'   # Har 4 ghante me automatic fetch
  workflow_dispatch:        # Manual "Run workflow" button

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Engine
        run: |
          python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Sarkari-Naukar-Bot"
          git config --global user.email "bot@sarkarinaukar.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-Sync: Latest Job Data [skip ci]" && git push)
