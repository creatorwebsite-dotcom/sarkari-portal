name: Sarkari Naukar Data Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Engine
        run: |
          python scraper.py

      - name: Verify Generated Database
        run: |
          ls -la jobs_database.json || echo "File not found!"
          cat jobs_database.json | head -n 30 || true

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "Sarkari-Naukar-Bot"
          git config --global user.email "bot@sarkarinaukar.com"
          git add -f jobs_database.json downloads/
          git status
          git diff --staged --quiet || (git commit -m "Auto-Sync: Fresh Jobs Database [skip ci]" && git push origin HEAD:main)
