name: Sarkari Naukar Data Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Engine
        run: |
          python scraper.py

      - name: Verify Generated Database
        run: |
          cat jobs_database.json | head -n 25

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs_database.json downloads/
          git commit -m "Auto-Sync: Fresh Jobs Data [skip ci]" || echo "No changes"
          git push
