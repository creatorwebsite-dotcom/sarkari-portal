name: Sarkari Naukar Data Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Engine
        run: |
          python scraper.py

      - name: Verify Generated Database
        run: |
          ls -lh jobs_database.json || echo "Database file missing!"

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f jobs_database.json downloads/
          git diff --staged --quiet || (git commit -m "Auto-Sync: Fresh Jobs Database [skip ci]" && git push origin HEAD)
