name: Sarkari Live Auto Feeder

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Execute Scraper
        run: python scraper.py

      - name: Auto Commit and Push Live JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto sync live feeds [skip ci]"
          file_pattern: "live_portal_data.json"
          skip_dirty_check: false
