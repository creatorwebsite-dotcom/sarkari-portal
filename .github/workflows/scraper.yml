name: Sarkari Live Auto Feeder

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Execute Scraper
        run: python scraper.py

      - name: Publish Live Data Directly
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "live-data"
          name: "Live Feed Data"
          files: live_portal_data.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
