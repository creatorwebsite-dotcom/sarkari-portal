name: Auto Fetch Government Job Data

on:
  schedule:
    - cron: '30 5 * * *'   # 11:00 AM IST
    - cron: '30 11 * * *'  # 05:00 PM IST
    - cron: '0 15 * * *'   # 08:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests beautifulsoup4

      - name: Run Scraper
        run: python scraper.py

      - name: Commit & Push Clean Data
        run: |
          git config --global user.name "SarkariNaukar-Bot"
          git config --global user.email "bot@sarkarinaukar.local"
          git add live_portal_data.json
          git commit -m "Auto-sync recruitment notices" || exit 0
          git push
