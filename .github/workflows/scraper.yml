name: Sarkari Live Auto Feeder

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install curl_cffi beautifulsoup4

      - name: Execute Scraper
        run: python scraper.py

      - name: Direct Upload via API (No Git Push Failures)
        uses: test-room-7/action-id-helper@v1
        continue-on-error: true

      - name: Commit & Push Changes
        uses: actions-js/push@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: 'main'
          message: 'Auto sync live feeds [skip ci]'
          force: true          git push origin main
